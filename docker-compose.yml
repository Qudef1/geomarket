services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: geomarket
      POSTGRES_USER: geomarket
      POSTGRES_PASSWORD: geomarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomarket"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  postgres_data:

