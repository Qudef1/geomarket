server {
  listen 80;
  root /usr/share/nginx/html;
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / { try_files $uri /index.html; }
}
